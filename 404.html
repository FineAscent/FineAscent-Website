<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">

  <meta name="theme-color" content="#E3E3E3">

  <link rel="stylesheet" href="/style.css">
  <style>
    body.nf-page { min-height: 100vh; scroll-snap-type: none; }
    .nf-page .section {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-sizing: border-box;
    }
    .nf-page .container { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .nf-page h1 { margin: 0; font-size: clamp(24px, 5.6vw, 42px); letter-spacing: 0.2px; }
    .nf-page p { margin: 0 0 12px; color: #333; font-size: clamp(16px, 3.8vw, 20px); line-height: 1.6; }
    .nf-page .btn-matte { text-decoration: none; }
  </style>
</head>
<body class="nf-page">
  <main class="section">
    <div class="container">
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <a class="btn-matte" href="/">Back to FineAscent</a>
    </div>
  </main>
