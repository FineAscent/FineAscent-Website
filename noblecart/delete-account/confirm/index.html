<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- Keeps the one-time token out of referrer headers and analytics. -->
  <meta name="referrer" content="no-referrer">
  <title>Confirm Account Deletion • NobleCart • FineAscent</title>
  <meta name="description" content="Confirm permanent deletion of your NobleCart account.">
  <link rel="stylesheet" href="../../../style.css">
  <style>
    /* ===== Confirm deletion page: matches the delete-account document layout ===== */
    body.inverted.doc-page {
      background: #000;
      color: #f5f5f5;
      min-height: auto;
      scroll-snap-type: none;
    }
    body.inverted.doc-page .section {
      background: #000;
      color: #f5f5f5;
      scroll-snap-align: none;
      scroll-snap-stop: normal;
      min-height: auto;
      padding: 0;
      opacity: 1;
      transform: none;
      transition: none;
    }
    body.inverted.doc-page .dot-nav { display: none; }

    .tp-shell {
      max-width: 620px;
      margin: 0 auto;
      padding: clamp(28px, 6vh, 72px) clamp(20px, 5vw, 48px) clamp(60px, 12vh, 140px);
    }

    /* Top bar: back links */
    .tp-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 22px;
      margin-bottom: clamp(28px, 6vh, 56px);
      font-size: 14px;
      letter-spacing: 0.2px;
    }
    .tp-topbar a {
      color: #cfcfcf;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      padding-bottom: 2px;
      transition: color 200ms ease, border-color 200ms ease;
    }
    .tp-topbar a:hover { color: #fff; border-color: #fff; }
    .tp-topbar .tp-brand {
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.4px;
      border: none;
      padding: 0;
    }
    .tp-topbar .tp-sep { color: rgba(255,255,255,0.3); }

    /* Header */
    .tp-header { margin-bottom: clamp(24px, 4vh, 36px); }
    .tp-eyebrow {
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
    .tp-title {
      margin: 0 0 14px;
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.1;
      letter-spacing: 0.2px;
      color: #fff;
    }
    .tp-subtitle {
      margin: 0;
      font-size: clamp(15px, 2.6vw, 18px);
      line-height: 1.6;
      color: rgba(255,255,255,0.75);
    }
    .tp-subtitle.err { color: rgba(255,180,180,0.95); }

    /* Warning notice */
    .tp-notice {
      margin: 24px 0 8px;
      padding: 16px 18px;
      border: 1px solid rgba(255,255,255,0.14);
      border-left: 3px solid rgba(255,120,120,0.7);
      border-radius: 8px;
      background: rgba(255,120,120,0.06);
    }
    .tp-notice p {
      margin: 0;
      font-size: clamp(14px, 2.4vw, 16px);
      line-height: 1.6;
      color: rgba(255,255,255,0.82);
    }
    .tp-notice strong { color: #fff; font-weight: 600; }

    /* Destructive action button */
    .da-danger {
      appearance: none;
      border: none;
      outline: none;
      margin-top: 28px;
      padding: 13px 26px;
      border-radius: 999px;
      background: #c9372c;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: background 200ms ease, transform 120ms ease, box-shadow 200ms ease;
    }
    .da-danger:hover { background: #d94438; box-shadow: 0 3px 12px rgba(0,0,0,0.3); }
    .da-danger:active { transform: translateY(1px); }
    .da-danger:focus-visible { box-shadow: 0 0 0 3px rgba(255,140,140,0.45), 0 3px 12px rgba(0,0,0,0.3); }
    .da-danger:disabled { opacity: 0.6; cursor: default; }

    /* Footer */
    .tp-footer {
      margin-top: clamp(40px, 8vh, 80px);
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.12);
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      line-height: 1.6;
    }
    .tp-footer a {
      color: rgba(255,255,255,0.7);
      border-bottom: 1px solid rgba(255,255,255,0.2);
      text-decoration: none;
    }
    .tp-footer a:hover { color: #fff; border-color: #fff; }

    @media (max-width: 640px) {
      .tp-shell { padding: 24px 18px 80px; }
    }
  </style>
</head>
<body class="inverted doc-page">
  <section class="section">
    <div class="tp-shell">

      <!-- Top bar with back links -->
      <nav class="tp-topbar" aria-label="Breadcrumb">
        <a class="tp-brand" href="../../../index.html">FineAscent</a>
        <span class="tp-sep" aria-hidden="true">/</span>
        <a href="../../../nobelcart.html">NobleCart</a>
        <span class="tp-sep" aria-hidden="true">/</span>
        <a href="../">Delete Account</a>
        <span class="tp-sep" aria-hidden="true">/</span>
        <a href="./" aria-current="page">Confirm</a>
      </nav>

      <!-- Header: rewritten by the script once the link has been checked -->
      <header class="tp-header">
        <p class="tp-eyebrow">NobleCart &middot; Account</p>
        <h1 class="tp-title" id="title">Checking your link…</h1>
        <p class="tp-subtitle" id="body" role="status" aria-live="polite">One moment.</p>
      </header>

      <div class="tp-notice" id="notice" hidden>
        <p>
          <strong>This cannot be undone.</strong> Your account, purchase history, saved items, and preferences are erased immediately and cannot be recovered.
        </p>
      </div>

      <button class="da-danger" id="confirm" type="button" hidden>Permanently delete my account</button>

      <!-- Footer -->
      <footer class="tp-footer">
        <p>
          <a href="../../../nobelcart.html">&larr; Back to NobleCart</a>
          &nbsp;&middot;&nbsp;
          <a href="../../privacy-policy/">Privacy Policy</a>
        </p>
      </footer>

    </div>
  </section>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // Only the project URL and the anon key belong in the browser.
    const SUPABASE_URL = "https://pkofxkcbdyqcunwjrnnx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrb2Z4a2NiZHlxY3Vud2pybm54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU1NzU0NTksImV4cCI6MjA3MTE1MTQ1OX0.OXyJ9EOJRo4YHf7TKVoeWMFPr9B9djrq9fciBSm0i0U";

    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false, autoRefreshToken: false },
    });

    const title = document.getElementById("title");
    const body = document.getElementById("body");
    const notice = document.getElementById("notice");
    const button = document.getElementById("confirm");

    function render(heading, text, isError) {
      title.textContent = heading;
      body.textContent = text;
      body.classList.toggle("err", !!isError);
    }

    const tokenHash = new URLSearchParams(location.search).get("token_hash");

    if (!tokenHash) {
      render("Link not valid", "This link is missing its token. Please start again from the account deletion page.", true);
    } else {
      // Redeeming the token proves the visitor can read the mailbox, and yields
      // the session whose JWT authorizes the delete. That is why the deletion
      // endpoint never has to trust an email address from a form.
      const { data, error } = await sb.auth.verifyOtp({
        token_hash: tokenHash,
        type: "magiclink",
      });

      // Strip the token from the address bar so it is not left in history.
      history.replaceState(null, "", location.pathname);

      if (error || !data?.session) {
        render("Link expired", "This confirmation link has already been used or has expired. Please request a new one from the account deletion page.", true);
      } else {
        render("Confirm deletion", `You're signed in as ${data.user.email}. Confirming permanently erases your NobleCart account and all data attached to it.`);
        notice.hidden = false;
        button.hidden = false;

        button.addEventListener("click", async () => {
          button.disabled = true;
          button.textContent = "Deleting…";

          try {
            const res = await fetch(`${SUPABASE_URL}/functions/v1/delete-account-confirmed`, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${data.session.access_token}`,
                "Content-Type": "application/json",
                "apikey": SUPABASE_ANON_KEY,
              },
              body: JSON.stringify({ confirm: "DELETE" }),
            });
            const report = await res.json();

            if (!res.ok && res.status !== 207) {
              throw new Error(report.error || "Deletion failed");
            }

            // 207 means the account is gone but a side step failed, so the user
            // must not be told to try again.
            if (!report.ok) console.warn("Partial deletion", report.steps);

            notice.hidden = true;
            button.hidden = true;
            render("Account deleted", "Your NobleCart account and its data have been permanently removed. You will not receive any further email from us.");
          } catch (err) {
            console.error("Deletion failed", err);
            button.disabled = false;
            button.textContent = "Permanently delete my account";
            const detail = err instanceof Error && err.message ? err.message : "";
            render(
              "Something went wrong",
              detail
                ? `We could not complete the deletion (${detail}). Please request a new link and try again.`
                : "We could not complete the deletion. Please request a new link and try again.",
              true,
            );
          } finally {
            try { await sb.auth.signOut(); } catch (_) {}
          }
        });
      }
    }
  </script>
</body>
</html>
