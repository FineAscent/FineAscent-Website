<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm account deletion</title>
  <!-- Keep the one-time token out of referrer headers and analytics. -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --ink: #2d2a26;
      --muted: #6b6560;
      --line: #e5e1db;
      --danger: #b3261e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #faf9f7;
      color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(45, 42, 38, .06), 0 8px 24px rgba(45, 42, 38, .06);
    }

    h1 { margin: 0 0 8px; font-size: 22px; }

    p { margin: 0 0 20px; color: var(--muted); }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--danger);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled { opacity: .55; cursor: default; }

    .err { color: var(--danger); }
  </style>
</head>

<body>
  <main class="card" id="card">
    <h1 id="title">Checking your link…</h1>
    <p id="body">One moment.</p>
    <button id="confirm" hidden type="button">Permanently delete my account</button>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false, autoRefreshToken: false },
    });

    const title = document.getElementById("title");
    const body = document.getElementById("body");
    const button = document.getElementById("confirm");

    function render(heading, text, isError) {
      title.textContent = heading;
      body.textContent = text;
      body.classList.toggle("err", !!isError);
    }

    const tokenHash = new URLSearchParams(location.search).get("token_hash");
    if (!tokenHash) {
      render("Link not valid", "This link is missing its token. Start again from the deletion page.", true);
    } else {
      // Redeeming the token proves the visitor can read the mailbox. It also
      // yields the session whose JWT authorizes the delete, which is why the
      // deletion endpoint never needs to trust an email address.
      const { data, error } = await sb.auth.verifyOtp({
        token_hash: tokenHash,
        type: "magiclink",
      });

      // Strip the token from the address bar so it is not left in history.
      history.replaceState(null, "", location.pathname);

      if (error || !data?.session) {
        render("Link expired", "This confirmation link has already been used or has expired. Please request a new one.", true);
      } else {
        render(
          "Confirm deletion",
          `You are signed in as ${data.user.email}. This permanently erases your account and all associated data. It cannot be undone.`,
        );
        button.hidden = false;

        button.addEventListener("click", async () => {
          button.disabled = true;
          button.textContent = "Deleting…";

          try {
            const res = await fetch(`${SUPABASE_URL}/functions/v1/delete-account`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${data.session.access_token}`,
                "Content-Type": "application/json",
                apikey: SUPABASE_ANON_KEY,
              },
              body: JSON.stringify({ confirm: "DELETE" }),
            });
            const report = await res.json();

            if (!report.ok) {
              // 207 means the account went but a side step failed. The user is
              // still deleted, so do not tell them to try again.
              console.warn("Partial deletion", report.steps);
            }

            button.hidden = true;
            render("Account deleted", "Your account and its data have been permanently removed. You will not receive any further email from us.");
          } catch (err) {
            button.disabled = false;
            button.textContent = "Permanently delete my account";
            render("Something went wrong", "We could not complete the deletion. Please request a new link and try again.", true);
          } finally {
            try { await sb.auth.signOut(); } catch (_) { }
          }
        });
      }
    }
  </script>
</body>

</html>
